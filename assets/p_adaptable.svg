<svg xmlns="http://www.w3.org/2000/svg" width="282" height="230" viewBox="0 0 282 230" font-family="&#39;JetBrains Mono&#39;,&#39;SFMono-Regular&#39;,Consolas,&#39;Liberation Mono&#39;,monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Degradado Amarillo-Naranja estilo GTA V -->
    <linearGradient id="gtav-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe0b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0.75" />
    </linearGradient>
    <!-- Fondo Gris Carbón / Asfalto -->
    <linearGradient id="gtav-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1f24" />
      <stop offset="100%" stop-color="#111315" />
    </linearGradient>
  </defs>

  <style>
    .r { opacity: 0; animation: f .45s ease forwards; }
    @keyframes f {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .r { animation: none; opacity: 1; }
    }
  </style>

  <!-- Ventana gris oscuro con borde amarillo-naranja -->
  <rect x="0.5" y="0.5" width="271" height="219" rx="10" fill="url(#gtav-bg)" stroke="url(#gtav-amber)" stroke-width="1.2" />
  
  <!-- Barra superior gris plomo -->
  <path d="M1 36V10.5a9.5 9.5 0 0 1 9.5-9.5H261.5a9.5 9.5 0 0 1 9.5 9.5V36z" fill="#23272e" />
  <rect x="1" y="35.5" width="270" height="1" fill="#ff9e00" fill-opacity="0.4" />

  <!-- Botones de ventana -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="40" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="18" r="6" fill="#27c93f" />

  <!-- Ruta del proyecto -->
  <text x="78" y="22" fill="#9ca3af" font-size="11.5">~/proyectos/gta-v</text>

  <!-- Contenido animado -->
  <text class="r" style="animation-delay:0.15s" x="22" y="62">
    <tspan fill="#ff9e00" font-weight="700">$ </tspan>
    <tspan fill="#ffffff">cat LosSantos.md</tspan>
  </text>
  <text class="r" style="animation-delay:0.50s" x="22" y="100" fill="#f3f4f6">Maquetación Mobile First</text>
  <text class="r" style="animation-delay:0.70s" x="22" y="124" fill="#d1d5db">inspirada en GTA V con</text>
  <text class="r" style="animation-delay:0.90s" x="22" y="148" fill="#d1d5db">galería en CSS Grid.</text>
  <text class="r" style="animation-delay:1.10s" x="22" y="182" fill="#ffbe0b" font-weight="700">→ HTML5 · CSS Grid</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>