<svg xmlns="http://www.w3.org/2000/svg" width="272" height="230" viewBox="0 0 272 230" font-family="&#39;JetBrains Mono&#39;,&#39;SFMono-Regular&#39;,Consolas,&#39;Liberation Mono&#39;,monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Degradado neón Vice City (Rosa #ff2a85 a Cian #00f0ff) -->
    <linearGradient id="vice-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="vice-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140f26" />
      <stop offset="100%" stop-color="#07050e" />
    </linearGradient>
  </defs>

  <style>
    .r { opacity: 0; animation: f .45s ease forwards; }
    @keyframes f {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .r { animation: none; opacity: 1; }
    }
  </style>

  <!-- Ventana con fondo #07050e y borde degradado Vice City -->
  <rect x="0.5" y="0.5" width="271" height="219" rx="10" fill="url(#vice-bg)" stroke="url(#vice-neon)" stroke-width="1.2" />
  
  <!-- Barra superior de la terminal adaptada al tono oscuro de Vice City -->
  <path d="M1 36V10.5a9.5 9.5 0 0 1 9.5-9.5H261.5a9.5 9.5 0 0 1 9.5 9.5V36z" fill="#120e21" />
  <rect x="1" y="35.5" width="270" height="1" fill="#ff2a85" fill-opacity="0.35" />

  <!-- Botones de ventana -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="40" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="18" r="6" fill="#27c93f" />

  <!-- Ruta del proyecto -->
  <text x="78" y="22" fill="#b4aec6" font-size="11.5">~/proyectos/gta-vi</text>

  <!-- Contenido animado -->
  <text class="r" style="animation-delay:0.15s" x="22" y="62">
    <tspan fill="#ff2a85" font-weight="700">$ </tspan>
    <tspan fill="#ffffff">cat ViceCity.md</tspan>
  </text>
  <text class="r" style="animation-delay:0.50s" x="22" y="100" fill="#ffffff">Web animada de GTA VI</text>
  <text class="r" style="animation-delay:0.70s" x="22" y="124" fill="#b4aec6">con tarjetas 3D, audio</text>
  <text class="r" style="animation-delay:0.90s" x="22" y="148" fill="#b4aec6">y guía de movimiento.</text>
  <text class="r" style="animation-delay:1.10s" x="22" y="182" fill="#00f0ff" font-weight="700">→ CSS 3D · Keyframes</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>